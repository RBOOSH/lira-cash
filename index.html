<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIRA CASH</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiTElSQSBDQVNIIiwic2hvcnRfbmFtZSI6IkxJUkEiLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMDgwODA4In0=">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#080808;color:#fff;padding-bottom:80px}
.hdr{padding:18px;display:flex;justify-content:space-between}
.card{margin:14px;background:linear-gradient(135deg,#eaff00,#c8ff00);color:#000;border-radius:28px;padding:22px}
.bal{font-size:40px;font-weight:900;direction:ltr;text-align:left}
.mini{flex:1;background:rgba(0,0,0,.12);border-radius:14px;padding:10px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px}
.act{background:#151515;border:1px solid #222;border-radius:20px;padding:14px;text-align:center}.act:active{scale:.92}
.ic{width:50px;height:50px;margin:0 auto 6px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}
.c1{background:#d4ff00;color:#000}.c2{background:#222;color:#fff}.c3{background:#fff;color:#000}.c4{background:#7c3aed;color:#fff}
.tx{background:#121212;border:1px solid #1e1e1e;border-radius:14px;padding:12px;display:flex;justify-content:space-between;margin-bottom:8px}
.modal{position:fixed;inset:0;background:#0a0a0a;z-index:100;display:none;padding:20px;flex-direction:column}.modal.open{display:flex}
.inp{width:100%;background:#181818;border:1.5px solid #2a2a2a;border-radius:12px;padding:14px;color:#fff;margin:6px 0}
.btn{width:100%;background:#d4ff00;color:#000;border:0;border-radius:12px;padding:14px;font-weight:900;margin-top:8px}
.btnS{background:#1e1e1e;color:#fff;border:1px solid #2a2a2a}
.curSel{display:flex;gap:8px}.curSel button{flex:1;padding:10px;border-radius:10px;background:#181818;color:#fff;border:1px solid #333}.curSel button.on{background:#d4ff00;color:#000}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:100px;font-weight:700;display:none;z-index:200}
.qr{background:#fff;border-radius:18px;padding:16px;text-align:center;color:#000;margin:12px 0}
</style>
</head>
<body>
<div class="hdr"><div style="font-weight:900;font-size:22px">LIRA <span style="color:#d4ff00">CASH</span></div><div style="display:flex;gap:8px"><button class="btnS" style="padding:6px 12px;border-radius:100px;font-size:11px" onclick="genPDF()">📄 PDF</button><div style="width:32px;height:32px;background:#d4ff00;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900">R</div></div></div>
<div class="card"><small>الرصيد الإجمالي • 1$=15,000 SYP</small><div class="bal" id="tot">0 SYP</div><div style="display:flex;gap:8px;margin-top:12px"><div class="mini"><small>ليرة سوري</small><b id="syp">0</b></div><div class="mini"><small>دولار</small><b id="usd">$0</b></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="margin:0;background:#000;color:#d4ff00" onclick="openM('add')">+ شحن رصيد</button><button onclick="shareWA('مرحبا، هذا رصيدي في LIRA CASH: '+document.getElementById('tot').innerText)" style="background:#25D366;color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:700">واتساب</button></div></div>
<div class="actions"><div class="act" onclick="openM('send')"><div class="ic c1">↗</div>تحويل</div><div class="act" onclick="openM('rec')"><div class="ic c2">↙</div>استلام</div><div class="act" onclick="openM('ex')"><div class="ic c3">⇄</div>تصريف</div><div class="act" onclick="genPDF()"><div class="ic c4">📄</div>كشف</div></div>
<div style="padding:0 14px"><h3>العمليات الأخيرة</h3><div id="list" style="margin-top:10px"></div></div>

<div class="modal" id="m_send"><div style="display:flex;justify-content:space-between"><h2>تحويل</h2><b onclick="closeM()" style="font-size:22px">×</b></div><input class="inp" id="to" placeholder="09xxxxxxxx"><div class="curSel"><button id="bS" class="on" onclick="setC('SYP')">SYP</button><button id="bU" onclick="setC('USD')">USD</button></div><input class="inp" id="am" type="number" placeholder="المبلغ"><button class="btn" onclick="doSend()">تأكيد + ارسال واتساب</button><button class="btn btnS" onclick="closeM()">الغاء</button></div>
<div class="modal" id="m_rec"><div style="display:flex;justify-content:space-between"><h2>استلام</h2><b onclick="closeM()" style="font-size:22px">×</b></div><div class="qr"><div id="myP" style="font-size:24px;font-weight:900;direction:ltr">09xx</div><img id="qrImg" style="width:180px;height:180px"><p style="font-size:11px;opacity:.6">شارك هذا الكود</p><button class="btn" onclick="shareWA('حوللي على LIRA CASH: '+user.phone+' https://rboosh.github.io/lira-cash/')">مشاركة واتساب 📲</button></div><button class="btn btnS" onclick="closeM()">اغلاق</button></div>
<div class="modal" id="m_ex"><div style="display:flex;justify-content:space-between"><h2>تصريف</h2><b onclick="closeM()" style="font-size:22px">×</b></div><input class="inp" id="exS" type="number" placeholder="SYP" oninput="calc('s')"><div style="text-align:center">⇅</div><input class="inp" id="exU" type="number" placeholder="USD" oninput="calc('u')"><button class="btn" onclick="doEx()">تصريف</button><button class="btn btnS" onclick="closeM()">الغاء</button></div>
<div class="modal" id="m_add"><h2>شحن تجريبي</h2><button class="btn" onclick="addB(50000,0)">+50,000 SYP</button><button class="btn" onclick="addB(0,10)">+ $10</button><button class="btn" onclick="addB(150000,25)">+150k + $25</button><button class="btn btnS" onclick="closeM()">اغلاق</button></div>
<div class="modal" id="m_auth" style="display:flex;justify-content:center"><div><h1 style="font-size:34px">LIRA <span style="color:#d4ff00">CASH</span></h1><p style="opacity:.5;margin:10px 0">ادخل واحصل 100k هدية</p><input class="inp" id="ph" value="0999123456"><input class="inp" id="pw" type="password" value="1234"><button class="btn" onclick="login()">دخول</button></div></div>
<div class="toast" id="toast"></div>
<script>
let RATE=15000,cur='SYP',user=JSON.parse(localStorage.getItem('lira_user')||'null');
const $=i=>document.getElementById(i);
const toast=t=>{let e=$('toast');e.innerText=t;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
const openM=i=>$(`m_${i}`).classList.add('open');const closeM=()=>document.querySelectorAll('.modal').forEach(m=>{if(m.id!='m_auth')m.classList.remove('open')});
function setC(c){cur=c;$('bS').classList.toggle('on',c=='SYP');$('bU').classList.toggle('on',c=='USD')}
function calc(t){if(t=='s')$('exU').value=((parseFloat($('exS').value)||0)/RATE).toFixed(2);else $('exS').value=Math.round((parseFloat($('exU').value)||0)*RATE)}
function shareWA(text){window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}
function refresh(){if(!user){$('m_auth').style.display='flex';return}$('m_auth').style.display='none';$('syp').innerText=(user.syp||0).toLocaleString()+' SYP';$('usd').innerText='$'+(user.usd||0).toFixed(2);$('tot').innerText=((user.syp||0)+(user.usd||0)*RATE).toLocaleString()+' SYP';$('myP').innerText=user.phone;$('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(user.phone);let tx=JSON.parse(localStorage.getItem('tx_'+user.phone)||'[]');$('list').innerHTML=tx.length?tx.map(x=>`<div class="tx"><div><b>${x.title}</b><br><small style="opacity:.5">${x.time}</small></div><div><b style="direction:ltr">${x.amount}</b><br><button onclick="shareWA('عملية LIRA CASH: ${x.title} - ${x.amount}')" style="font-size:10px;background:#25D366;color:#fff;border:0;border-radius:8px;padding:4px 8px">واتساب</button></div></div>`).join(''):'<div style="text-align:center;opacity:.3;padding:20px">لا يوجد عمليات</div>'}
function login(){let ph=$('ph').value;if(ph.length<10){toast('رقم غلط');return}user={phone:ph,syp:100000,usd:5};localStorage.setItem('lira_user',JSON.stringify(user));refresh();toast('100,000 هدية 🎉')}
function doSend(){let to=$('to').value,am=parseFloat($('am').value);if(!to||!am){toast('اكمل البيانات');return}if(cur=='SYP'&&am>user.syp){toast('رصيد غير كافي');return}if(cur=='USD'&&am>user.usd){toast('رصيد غير كافي');return}if(cur=='SYP')user.syp-=am;else user.usd-=am;localStorage.setItem('lira_user',JSON.stringify(user));let tx=JSON.parse(localStorage.getItem('tx_'+user.phone)||'[]');tx.unshift({title:`تحويل إلى ${to}`,amount:`-${am} ${cur}`,time:new Date().toLocaleString('ar-SY')});localStorage.setItem('tx_'+user.phone,JSON.stringify(tx));closeM();refresh();let msg=`✅ تم التحويل عبر LIRA CASH\nالمبلغ: ${am} ${cur}\nإلى: ${to}\nمن: ${user.phone}\nhttps://rboosh.github.io/lira-cash/`;shareWA(msg)}
function doEx(){let s=parseFloat($('exS').value)||0,u=parseFloat($('exU').value)||0;if(s){if(s>user.syp){toast('لا يكفي');return}user.syp-=s;user.usd+=s/RATE}else if(u){if(u>user.usd){toast('لا يكفي');return}user.usd-=u;user.syp+=Math.round(u*RATE)}else{toast('اكتب مبلغ');return}localStorage.setItem('lira_user',JSON.stringify(user));let tx=JSON.parse(localStorage.getItem('tx_'+user.phone)||'[]');tx.unshift({title:'تصريف عملة',amount:'⇄',time:new Date().toLocaleString('ar-SY')});localStorage.setItem('tx_'+user.phone,JSON.stringify(tx));closeM();refresh();toast('تم التصريف ✅')}
function addB(s,u){user.syp+=s;user.usd+=u;localStorage.setItem('lira_user',JSON.stringify(user));refresh();closeM();toast('تم الشحن')}
function genPDF(){if(!user){toast('سجل اولا');return}const {jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFont('helvetica');doc.text('LIRA CASH - Statement',10,15);doc.text(`Phone: ${user.phone}`,10,25);doc.text(`SYP: ${user.syp}`,10,35);doc.text(`USD: ${user.usd}`,10,45);doc.text(`Total: ${(user.syp+user.usd*RATE).toLocaleString()} SYP`,10,55);let tx=JSON.parse(localStorage.getItem('tx_'+user.phone)||'[]');let y=70;tx.slice(0,20).forEach(t=>{doc.text(`${t.title} | ${t.amount} | ${t.time}`,10,y);y+=8});doc.save(`LIRA_${user.phone}.pdf`);toast('تم تحميل PDF 📄')}
setC('SYP');refresh();
</script>
</body>
</html>
