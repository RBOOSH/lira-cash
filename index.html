<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIRA CASH</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#0a0a0a;color:#fff;padding-bottom:80px}
.header{padding:18px;display:flex;justify-content:space-between}
.logo{font-weight:900;font-size:22px}.logo span{color:#c8ff00}
.card{margin:14px;background:linear-gradient(135deg,#d4ff00,#a8ff00);color:#000;border-radius:24px;padding:22px}
.bal{font-size:34px;font-weight:900;direction:ltr;text-align:right}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px}
.btnBox{background:#171717;border:1px solid #262626;border-radius:18px;padding:14px;text-align:center}
.btnBox i{width:44px;height:44px;background:#c8ff00;color:#000;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;border-radius:12px;font-style:normal;font-weight:900}
.modal{position:fixed;inset:0;background:#0e0e0e;z-index:99;display:none;padding:20px;flex-direction:column}
.modal.open{display:flex}.inp{width:100%;background:#1e1e1e;border:1px solid #333;color:#fff;border-radius:12px;padding:14px;margin:8px 0;font-size:16px}
.btnMain{width:100%;background:#c8ff00;color:#000;border:0;border-radius:12px;padding:14px;font-weight:900;margin-top:10px;font-size:16px}
.btnSec{background:#222;color:#fff}
</style>
</head>
<body>
<div class="header"><div class="logo">LIRA <span>CASH</span></div><div id="av" style="width:34px;height:34px;background:#c8ff00;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900">R</div></div>
<div class="card"><small>الرصيد • 15,000 SYP = $1</small><div class="bal" id="tot">0 SYP</div><div style="display:flex;gap:10px;margin-top:12px"><div style="flex:1;background:rgba(0,0,0,.1);border-radius:12px;padding:10px;text-align:center"><small>SYP</small><br><b id="syp">0</b></div><div style="flex:1;background:rgba(0,0,0,.1);border-radius:12px;padding:10px;text-align:center"><small>USD</small><br><b id="usd">$0</b></div></div></div>
<div class="grid"><div class="btnBox" onclick="openM('send')"><i>↗</i>تحويل</div><div class="btnBox" onclick="openM('rec')"><i>↙</i>استلام</div><div class="btnBox" onclick="openM('ex')"><i>⇄</i>تصريف</div><div class="btnBox" onclick="resetApp()"><i>↻</i>ضبط</div></div>
<div class="modal" id="m_send"><h2>تحويل</h2><input class="inp" id="to" placeholder="09xxxxxxxx"><input class="inp" id="am" type="number" placeholder="المبلغ SYP"><button class="btnMain" onclick="doSend()">تأكيد التحويل</button><button class="btnMain btnSec" onclick="closeM()">الغاء</button></div>
<div class="modal" id="m_rec"><h2>استلام</h2><div style="background:#fff;color:#000;border-radius:18px;padding:20px;text-align:center;margin:18px 0;font-size:22px;font-weight:900" id="myP">09xx</div><button class="btnMain btnSec" onclick="closeM()">اغلاق</button></div>
<div class="modal" id="m_ex"><h2>تصريف</h2><input class="inp" id="exS" type="number" placeholder="SYP" oninput="calc('s')"><div style="text-align:center">⇅</div><input class="inp" id="exU" type="number" placeholder="USD" oninput="calc('u')"><button class="btnMain" onclick="doEx()">تصريف</button><button class="btnMain btnSec" onclick="closeM()">الغاء</button></div>
<div class="modal" id="m_auth" style="display:flex"><div style="margin-top:40px"><h1 style="font-size:30px">مرحبا في<br><span style="color:#c8ff00">LIRA CASH</span></h1><p style="opacity:.6;margin:10px 0">سجل واحصل على 100,000 SYP هدية</p><input class="inp" id="ph" value="0999123456"><input class="inp" id="pw" type="password" value="1234"><button class="btnMain" onclick="login()">دخول • 100,000 SYP هدية</button></div></div>
<script>
let user=JSON.parse(localStorage.getItem('lira_user')||'null'),RATE=15000;
function openM(id){document.getElementById('m_'+id).classList.add('open')}
function closeM(){document.querySelectorAll('.modal').forEach(m=>{if(m.id!='m_auth')m.classList.remove('open')})}
function calc(t){let s=document.getElementById('exS'),u=document.getElementById('exU');if(t=='s'){u.value=(parseFloat(s.value)||0)/RATE}else{s.value=Math.round((parseFloat(u.value)||0)*RATE)}}
function resetApp(){if(confirm('اعادة ضبط؟')){localStorage.clear();location.reload()}}
function refresh(){if(!user){document.getElementById('m_auth').style.display='flex';return}document.getElementById('m_auth').style.display='none';document.getElementById('syp').innerText=(user.syp||0).toLocaleString();document.getElementById('usd').innerText='$'+(user.usd||0);document.getElementById('tot').innerText=((user.syp||0)+(user.usd||0)*RATE).toLocaleString()+' SYP';document.getElementById('myP').innerText=user.phone}
function login(){let ph=document.getElementById('ph').value;user={phone:ph,syp:100000,usd:10};localStorage.setItem('lira_user',JSON.stringify(user));refresh()}
function doSend(){let am=parseFloat(document.getElementById('am').value);if(am>user.syp){alert('رصيد غير كافي');return}user.syp-=am;localStorage.setItem('lira_user',JSON.stringify(user));closeM();refresh();alert('تم التحويل ✅')}
function doEx(){let s=parseFloat(document.getElementById('exS').value)||0,u=parseFloat(document.getElementById('exU').value)||0;if(s>0){if(s>user.syp){alert('ما بكفي');return}user.syp-=s;user.usd+=s/RATE}else if(u>0){if(u>user.usd){alert('ما بكفي');return}user.usd-=u;user.syp+=Math.round(u*RATE)}localStorage.setItem('lira_user',JSON.stringify(user));closeM();refresh();alert('تم التصريف ✅')}
refresh();
</script>
</body>
</html>
